<svg xmlns="http://www.w3.org/2000/svg" width="600" height="620" viewBox="0 0 600 620"><rect width="100%" height="100%" fill="#f4f4f4"/><text x="20" y="24" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#a33" text-anchor="start">02 Idle, then Up to date</text>
<rect x="20" y="36" width="560" height="560" rx="10" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="44" y="72" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#222" text-anchor="start">Updates</text>
<rect x="540" y="52" width="30" height="30" rx="6" fill="#fff" stroke="#555" stroke-width="1.5"/>
<text x="555" y="72" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">X</text>
<text x="44" y="104" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">You are running BIMCraft {version}.</text>
<text x="44" y="128" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#555" text-anchor="start">Update channel</text>
<rect x="44" y="136" width="100" height="30" rx="6" fill="#dfe8ff" stroke="#2b5fd9" stroke-width="1.5"/>
<text x="94" y="156" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">Stable</text>
<rect x="144" y="136" width="100" height="30" rx="6" fill="#fff" stroke="#555" stroke-width="1.5"/>
<text x="194" y="156" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="middle">Beta</text>
<text x="44" y="186" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555" text-anchor="start">Recommended. Releases that have been tested.</text>
<rect x="44" y="206" width="18" height="18" rx="9" fill="#fff" stroke="#555" stroke-width="1.5"/>
<rect x="48" y="210" width="10" height="10" rx="5" fill="#2b5fd9" stroke="#2b5fd9" stroke-width="1.5"/>
<text x="72" y="220" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">Check for updates automatically</text>
<text x="44" y="240" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#555" text-anchor="start">Checks once at start. Never downloads without asking. Sends no project data.</text>
<rect x="44" y="258" width="512" height="40" rx="6" fill="#f0f4ff" stroke="#9ab" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="60" y="283" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222" text-anchor="start">Select Check now to look for a newer version.</text>
<text x="44" y="314" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#a33" text-anchor="start">[Idle]   focus: Check now</text>
<text x="44" y="338" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#999" text-anchor="start">--- or, after a check ---</text>
<rect x="44" y="350" width="512" height="60" rx="6" fill="#f0f4ff" stroke="#9ab" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="60" y="375" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222" text-anchor="start">BIMCraft {version} is up to date.</text>
<text x="60" y="396" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555" text-anchor="start">Last checked {time}.</text>
<rect x="450" y="426" width="90" height="32" rx="6" fill="#fff" stroke="#555" stroke-width="1.5"/>
<text x="495.0" y="446.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="middle">Close</text>
<rect x="44" y="426" width="100" height="32" rx="6" fill="#fff" stroke="#555" stroke-width="1.5"/>
<text x="94.0" y="446.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="middle">Check now</text>
<text x="44" y="474" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#a33" text-anchor="start">[Up to date]   focus: Close</text></svg>