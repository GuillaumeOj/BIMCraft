<svg xmlns="http://www.w3.org/2000/svg" width="600" height="480" viewBox="0 0 600 480"><rect width="100%" height="100%" fill="#f4f4f4"/><text x="20" y="24" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#a33" text-anchor="start">03 Checking</text>
