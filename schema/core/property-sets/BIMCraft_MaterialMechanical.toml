format = 1

[property_set]
name = "BIMCraft_MaterialMechanical"
applies_to = ["Material"]
doc = """
Mechanical and physical properties of a material, each with its source. An IFC export writes the \
values to `Pset_MaterialCommon` and `Pset_MaterialMechanical`, with each source in the property's Specification.\
"""

[[property]]
name = "MassDensity"
value = "quantity:mass_density"
sourced = true
doc = "Mass per unit volume."

[[property]]
name = "YoungModulus"
value = "quantity:pressure"
sourced = true
doc = "Modulus of elasticity; for concrete, the secant modulus."

[[property]]
name = "PoissonRatio"
value = "real"
sourced = true
doc = "Ratio of lateral to axial strain under axial load."

[[property]]
name = "ThermalExpansionCoefficient"
value = "real"
sourced = true
doc = "Linear thermal expansion, per kelvin."
