# cargo-deny configuration (SEC-05). Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Keep in sync with .cargo/audit.toml. Each entry says why it cannot be fixed here.
# RUSTSEC-2024-0429 (glib, unsound) is ignored there only: cargo-deny does not report unsound
# advisories of dependencies, and an unused ignore here warns. The same goes for RUSTSEC-2026-0543
# (chrono, unmaintained, via serde_with and Tauri 2.12.5's tauri-utils, no flaw known): cargo-deny
# does not encounter it, so only .cargo/audit.toml ignores it, with its reason.
ignore = [
  # Through gtk 0.18 (gtk3-macros), the GTK 3 stack Tauri 2 uses for its Linux webview; no
  # Tauri 2 release moves off it. A compile-time macro helper only, unmaintained, no flaw known.
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via Tauri 2's GTK 3 stack (Linux), compile time only" },
  # Through zbus 5, which tauri-plugin-opener =2.7.2 needs on Linux; zbus 6 folded these crates in,
  # and no plugin release is on zbus 6 yet. Unmaintained, no flaw known; drop them when it is.
  { id = "RUSTSEC-2026-0370", reason = "zvariant via tauri-plugin-opener 2.7.2's zbus 5 (Linux), no flaw known" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names via tauri-plugin-opener 2.7.2's zbus 5 (Linux), no flaw known" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via tauri-plugin-opener 2.7.2's zbus 5 (Linux), no flaw known" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The allow list is a policy for future dependencies, not an inventory of current ones. This file
# also serves fuzz/, so an exception for a fuzz-only crate never matches in the main workspace.
unused-allowed-license = "allow"
unused-license-exception = "allow"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

# libfuzzer-sys bundles LLVM's libFuzzer under NCSA, a permissive licence. It only builds the fuzz
# targets in fuzz/, never a shipped binary.
[[licenses.exceptions]]
crate = "libfuzzer-sys"
allow = ["NCSA"]

# webpki-root-certs is Mozilla's list of root certificates, as data, under CDLA-Permissive-2.0, a
# permissive data licence (attribution only). The updater's HTTPS client (reqwest with rustls)
# verifies certificates with rustls-platform-verifier, which needs it only on wasm32: the program
# never builds there, but cargo deny checks every target.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Tauri's dependency tree brings its own versions of common crates (thiserror 1, toml 0.8, syn 1…);
# they are not ours to unify. Duplicates outside these trees still warn.
skip-tree = [
  { crate = "tauri", reason = "the desktop window's own dependency tree" },
  { crate = "tauri-build", reason = "the desktop window's build-time dependency tree" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
