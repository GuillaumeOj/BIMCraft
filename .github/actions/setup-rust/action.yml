# Shared by every Rust job in ci.yml and release.yml: tool versions, the pinned toolchain and the build cache.
# Callers check out the repository first, since this action is read from it.
name: Set up Rust
description: Load scripts/tool-versions.env, install the pinned Rust toolchain and restore the cache.

inputs:
  directory:
    description: Cargo workspace whose rust-toolchain.toml and target directory to use.
    default: .

runs:
  using: composite
  steps:
    - name: Load tool versions
      shell: bash
      run: grep -E '^[A-Z_]+=' scripts/tool-versions.env >> "$GITHUB_ENV"
    - name: Install pinned Rust toolchain (rust-toolchain.toml)
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: rustup toolchain install
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: ${{ inputs.directory }}
