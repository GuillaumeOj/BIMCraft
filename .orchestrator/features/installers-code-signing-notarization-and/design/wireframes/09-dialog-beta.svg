<svg xmlns="http://www.w3.org/2000/svg" width="600" height="580" viewBox="0 0 600 580"><rect width="100%" height="100%" fill="#f4f4f4"/><text x="20" y="24" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#a33" text-anchor="start">09 Beta selected</text>
<rect x="20" y="36" width="560" height="520" rx="10" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="44" y="72" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#222" text-anchor="start">Updates</text>
<rect x="540" y="52" width="30" height="30" rx="6" fill="#fff" stroke="#555" stroke-width="1.5"/>
<text x="555" y="72" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">X</text>
<text x="44" y="104" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">You are running BIMCraft {version}.</text>
<text x="44" y="128" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#555" text-anchor="start">Update channel</text>
<rect x="44" y="136" width="100" height="30" rx="6" fill="#fff" stroke="#555" stroke-width="1.5"/>
<text x="94" y="156" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="middle">Stable</text>
<rect x="144" y="136" width="100" height="30" rx="6" fill="#dfe8ff" stroke="#2b5fd9" stroke-width="1.5"/>
<text x="194" y="156" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">Beta</text>
<text x="44" y="186" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555" text-anchor="start">Early access to new features. It may contain bugs.</text>
<text x="44" y="204" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#8a5a00" text-anchor="start">Use Beta only if you accept occasional problems. You can go back to Stable at any time.</text>
<rect x="44" y="224" width="18" height="18" rx="9" fill="#fff" stroke="#555" stroke-width="1.5"/>
<rect x="48" y="228" width="10" height="10" rx="5" fill="#2b5fd9" stroke="#2b5fd9" stroke-width="1.5"/>
<text x="72" y="238" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">Check for updates automatically</text>
<text x="44" y="258" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#555" text-anchor="start">Checks once at start. Never downloads without asking. Sends no project data.</text>
<rect x="44" y="276" width="512" height="60" rx="6" fill="#f0f4ff" stroke="#9ab" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="60" y="301" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222" text-anchor="start">BIMCraft {version} is up to date.</text>
<text x="60" y="322" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555" text-anchor="start">Last checked {time}.</text>
<text x="44" y="358" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#555" text-anchor="start">Stable chosen while running a beta shows instead:</text>
<text x="44" y="376" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8a5a00" text-anchor="start">&#x27;You are running a beta. It stays installed until a newer Stable version is released.&#x27;</text>
<rect x="450" y="392" width="90" height="32" rx="6" fill="#fff" stroke="#555" stroke-width="1.5"/>
<text x="495.0" y="412.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="middle">Close</text>
<rect x="44" y="392" width="100" height="32" rx="6" fill="#fff" stroke="#555" stroke-width="1.5"/>
<text x="94.0" y="412.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="middle">Check now</text></svg>