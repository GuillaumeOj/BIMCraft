[files]
extend-exclude = [
  "*.lock",
  "target/",
  "ui/node_modules/",
  "crates/geom/tests/golden.txt",
  # Vendored unchanged from buildingSMART.
  "crates/interop-ifc/schema/*.exp",
  # Translated interface strings (UI-04); typos checks English only.
  "ui/src/i18n/messages/*.json",
  "!ui/src/i18n/messages/en.json",
]

[default.extend-words]
# Domain abbreviations used in the specification.
LOD = "LOD" # level of detail
THM = "THM" # thermal requirement family
ND = "ND" # NoDerivatives, in the CC BY-ND licence name
# Authors cited in the documentation.
Gere = "Gere" # James M. Gere, co-author of Timoshenko and Gere
