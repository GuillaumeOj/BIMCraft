# Fuzz targets for the parsers and the geometry kernel (ENG-02), run with cargo-fuzz on the nightly
# in rust-toolchain.toml.
# A workspace of its own: libFuzzer needs nightly sanitizers, and the main workspace stays stable.
# How to run: docs/dev/quality.md.

[package]
name = "bimcraft-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
api = { path = "../crates/api", features = ["conformance"] }
core-model = { path = "../crates/core-model" }
core-txn = { path = "../crates/core-txn" }
express = { path = "../crates/express" }
geom = { path = "../crates/geom" }
interop-ifc = { path = "../crates/interop-ifc" }
libfuzzer-sys = "=0.4.13"
# Already in the lockfile through geom: turns the fuzzed boxes the way the kernel would (ENG-04).
libm = "=0.2.16"
persist = { path = "../crates/persist" }
schema = { path = "../crates/schema" }
schema-gen = { path = "../crates/schema-gen" }
# Already in the lockfile through api: reads the server's answers back.
serde_json = "=1.0.154"

# A native test tool, not a core crate: libFuzzer's harness writes crash files, which the ARCH-02
# lints of clippy.toml would flag inside `fuzz_target!`.
[lints.clippy]
disallowed_methods = "allow"
disallowed_types = "allow"

[[bin]]
name = "boolean"
path = "fuzz_targets/boolean.rs"
test = false
doc = false
bench = false

[[bin]]
name = "express_schema"
path = "fuzz_targets/express_schema.rs"
test = false
doc = false
bench = false

[[bin]]
name = "extruded_boolean"
path = "fuzz_targets/extruded_boolean.rs"
test = false
doc = false
bench = false

[[bin]]
name = "extrusion"
path = "fuzz_targets/extrusion.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jsonrpc"
path = "fuzz_targets/jsonrpc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "location"
path = "fuzz_targets/location.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_quantity"
path = "fuzz_targets/parse_quantity.rs"
test = false
doc = false
bench = false

[[bin]]
name = "profile"
path = "fuzz_targets/profile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "project_values"
path = "fuzz_targets/project_values.rs"
test = false
doc = false
bench = false

[[bin]]
name = "schema_definition"
path = "fuzz_targets/schema_definition.rs"
test = false
doc = false
bench = false

[[bin]]
name = "step_reader"
path = "fuzz_targets/step_reader.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
