[package]
name = "render"
version = "0.0.0"
description = "Renderer of the 3D viewport, with camera-relative transforms in double precision."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Only the criterion harness benches; libtest would reject criterion's options.
[lib]
bench = false

[dependencies]
bytemuck = { workspace = true }
geom = { workspace = true }
libm = { workspace = true }
thiserror = { workspace = true }
wgpu = { workspace = true }

[dev-dependencies]
pollster = { workspace = true }
proptest = { workspace = true }

# Native only, like the benches it runs.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "frame"
harness = false

[lints]
workspace = true
