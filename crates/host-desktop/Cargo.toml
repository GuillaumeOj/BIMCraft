[package]
name = "host-desktop"
version = "0.0.0"
description = "Desktop host: the document served to the window, and platform traits backed by files, threads, the system clock and processes."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
api = { workspace = true }
core-model = { workspace = true }
core-txn = { workspace = true }
platform = { workspace = true }
rayon = { workspace = true }
schema = { workspace = true }
schema-gen = { workspace = true }
scene = { workspace = true }
scene-wire = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tauri = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
geom = { workspace = true }
api = { workspace = true, features = ["conformance"] }
material = { workspace = true }
persist = { workspace = true }
platform = { workspace = true, features = ["testing"] }
proptest = { workspace = true }
tauri = { workspace = true, features = ["test"] }

# Native only, like the benches it runs.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
criterion = { workspace = true }

# Only the criterion harness benches; libtest would reject criterion's options.
[lib]
bench = false

[[bench]]
name = "move"
harness = false

# Test fixture: a stand-in solver that the compute tests start as a child process.
[[bin]]
name = "test-solver"
test = false
doc = false

[lints]
workspace = true
