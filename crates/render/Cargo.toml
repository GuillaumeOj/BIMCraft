[package]
name = "render"
version = "0.0.0"
description = "Renderer of the 3D viewport, with camera-relative transforms in double precision."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# The negative control of the jitter test (tests/jitter.rs): lets a renderer measure coordinates
# from the world origin, as a classic pipeline does. Hidden, not part of the API.
jitter-control = []

[dependencies]
bytemuck = { workspace = true }
geom = { workspace = true }
libm = { workspace = true }
thiserror = { workspace = true }
wgpu = { workspace = true }

[dev-dependencies]
pollster = { workspace = true }
proptest = { workspace = true }
# The crate itself, with the negative control of its jitter test.
render = { workspace = true, features = ["jitter-control"] }

[lints]
workspace = true
