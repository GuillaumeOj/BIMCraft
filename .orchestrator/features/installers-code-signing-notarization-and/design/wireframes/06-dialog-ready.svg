<svg xmlns="http://www.w3.org/2000/svg" width="600" height="480" viewBox="0 0 600 480"><rect width="100%" height="100%" fill="#f4f4f4"/><text x="20" y="24" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#a33" text-anchor="start">06 Ready to restart</text>
<rect x="20" y="36" width="560" height="420" rx="10" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="44" y="72" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#222" text-anchor="start">Updates</text>
<rect x="540" y="52" width="30" height="30" rx="6" fill="#fff" stroke="#555" stroke-width="1.5"/>
<text x="555" y="72" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">X</text>
<text x="44" y="104" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">You are running BIMCraft {version}.</text>
<text x="44" y="128" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#555" text-anchor="start">Update channel</text>
<rect x="44" y="136" width="100" height="30" rx="6" fill="#dfe8ff" stroke="#aaa" stroke-width="1.5"/>
<text x="94" y="156" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#999" text-anchor="middle">Stable</text>
<rect x="144" y="136" width="100" height="30" rx="6" fill="#fff" stroke="#aaa" stroke-width="1.5"/>
<text x="194" y="156" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#999" text-anchor="middle">Beta</text>
<text x="44" y="186" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555" text-anchor="start">Recommended. Releases that have been tested.</text>
<rect x="44" y="206" width="18" height="18" rx="9" fill="#fff" stroke="#555" stroke-width="1.5"/>
<rect x="48" y="210" width="10" height="10" rx="5" fill="#2b5fd9" stroke="#2b5fd9" stroke-width="1.5"/>
<text x="72" y="220" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">Check for updates automatically</text>
<text x="44" y="240" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#555" text-anchor="start">Checks once at start. Never downloads without asking. Sends no project data.</text>
<rect x="44" y="262" width="512" height="60" rx="6" fill="#f0f4ff" stroke="#9ab" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="60" y="287" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222" text-anchor="start">BIMCraft {version} is ready to install.</text>
<text x="60" y="308" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555" text-anchor="start">Restart BIMCraft to finish the update. You can do it later.</text>
<rect x="424" y="338" width="116" height="32" rx="6" fill="#2b5fd9" stroke="#2b5fd9" stroke-width="1.5"/>
<text x="482.0" y="358.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">Restart now</text>
<rect x="326" y="338" width="90" height="32" rx="6" fill="#fff" stroke="#555" stroke-width="1.5"/>
<text x="371.0" y="358.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="middle">Later</text>
<text x="44" y="386" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#a33" text-anchor="start">focus: Restart now. Later closes; the title-bar pill stays &#x27;Restart to update&#x27;.</text></svg>
