# Versions are pinned exactly (AGENTS.md §4); Dependabot proposes the bumps.
# A 14-day cooldown matches the minimum release age rule.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    versioning-strategy: increase
    groups:
      rust-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: bun
    directory: /ui
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    versioning-strategy: increase
    groups:
      ui-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
