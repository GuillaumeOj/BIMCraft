[package]
name = "desktop-app"
version = "0.0.0"
description = "The BIMCraft desktop program: the web interface in a Tauri window on a document."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "bimcraft"
path = "src/main.rs"

[dependencies]
host-desktop = { workspace = true }
# Tauri's default window features, less dbus and dynamic-acl, which nothing uses: wry, the
# webview runtime (WKWebView, WebView2, WebKitGTK); x11, for Linux X11 sessions as well as
# Wayland; compression of the embedded UI; Windows' version 6 common controls.
tauri = { workspace = true, features = [
  "wry",
  "x11",
  "compression",
  "common-controls-v6",
] }
thiserror = { workspace = true }

[build-dependencies]
tauri-build = { workspace = true }

[lints]
workspace = true
