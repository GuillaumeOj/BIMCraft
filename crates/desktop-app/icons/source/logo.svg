<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<title>BIMCraft</title>
<!-- BIMCraft app icon, full detail (48 px and up). An isometric building seen like an X-ray:
     finished facade at the bottom, fading into the concrete frame, fading into the rebar cage.
     Each layer sits between "layer:<name>" markers so scripts/build-icons.ts can export it alone
     for the macOS Icon Composer file. Keep shapes flat: macOS adds the glass, light and depth. -->
<defs>
<linearGradient id="fade-facade" gradientUnits="userSpaceOnUse" x1="512" y1="880" x2="512" y2="180"><stop offset="0.38" stop-color="#FFFFFF"/><stop offset="0.52" stop-color="#000000"/></linearGradient>
<linearGradient id="fade-frame" gradientUnits="userSpaceOnUse" x1="512" y1="880" x2="512" y2="180"><stop offset="0.60" stop-color="#FFFFFF"/><stop offset="0.74" stop-color="#000000"/></linearGradient>
<mask id="mask-facade" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><rect width="1024" height="1024" fill="url(#fade-facade)"/></mask>
<mask id="mask-frame" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><rect width="1024" height="1024" fill="url(#fade-frame)"/></mask>
<pattern id="windows-left" patternUnits="userSpaceOnUse" x="20" y="-400" width="50" height="64"><rect x="0" y="14" width="38" height="36" fill="#0E574D"/><rect x="18" y="14" width="2" height="36" fill="#FFFFFF"/><rect x="0" y="48" width="38" height="3" fill="#D5E5E1"/></pattern>
<pattern id="windows-right" patternUnits="userSpaceOnUse" x="18" y="-400" width="46" height="64"><rect x="0" y="14" width="36" height="36" fill="#0E574D"/><rect x="17" y="14" width="2" height="36" fill="#D5E5E1"/><rect x="0" y="48" width="36" height="3" fill="#FFFFFF"/></pattern>
<pattern id="stirrups" patternUnits="userSpaceOnUse" x="0" y="0" width="300" height="16"><rect width="300" height="2.5" fill="#B4F5E4"/></pattern>
<pattern id="mesh" patternUnits="userSpaceOnUse" x="0" y="0" width="21" height="21"><rect width="21" height="2" fill="#B4F5E4"/><rect width="2" height="21" fill="#B4F5E4"/></pattern>
</defs>
<!-- layer:background -->
<rect width="1024" height="1024" rx="230" fill="#0F6B5E"/>
<!-- /layer -->
<!-- layer:rebar -->
<g transform="translate(512 512) scale(1.18) translate(-510 -507)" fill="#B4F5E4">
<g transform="matrix(-0.866 -0.5 0 1 540 850)">
<rect x="3" y="-450" width="3" height="450"/><rect x="12" y="-450" width="3" height="450"/>
<rect x="90" y="-450" width="3" height="450"/><rect x="99" y="-450" width="3" height="450"/>
<rect x="178" y="-450" width="3" height="450"/><rect x="187" y="-450" width="3" height="450"/>
<rect x="265" y="-450" width="3" height="450"/><rect x="274" y="-450" width="3" height="450"/>
<rect y="-399" width="280" height="2.5"/><rect y="-335" width="280" height="2.5"/><rect y="-271" width="280" height="2.5"/><rect y="-207" width="280" height="2.5"/><rect y="-143" width="280" height="2.5"/><rect y="-79" width="280" height="2.5"/>
<rect y="-393" width="280" height="2.5"/><rect y="-329" width="280" height="2.5"/><rect y="-265" width="280" height="2.5"/><rect y="-201" width="280" height="2.5"/><rect y="-137" width="280" height="2.5"/><rect y="-73" width="280" height="2.5"/>
<rect y="-400" width="18" height="400" fill="url(#stirrups)"/><rect x="87" y="-400" width="18" height="400" fill="url(#stirrups)"/><rect x="175" y="-400" width="18" height="400" fill="url(#stirrups)"/><rect x="262" y="-400" width="18" height="400" fill="url(#stirrups)"/>
</g>
<g transform="matrix(0.866 -0.5 0 1 540 850)">
<rect x="3" y="-450" width="3" height="450"/><rect x="12" y="-450" width="3" height="450"/>
<rect x="99" y="-450" width="3" height="450"/><rect x="108" y="-450" width="3" height="450"/>
<rect x="195" y="-450" width="3" height="450"/><rect x="204" y="-450" width="3" height="450"/>
<rect y="-399" width="210" height="2.5"/><rect y="-335" width="210" height="2.5"/><rect y="-271" width="210" height="2.5"/><rect y="-207" width="210" height="2.5"/><rect y="-143" width="210" height="2.5"/><rect y="-79" width="210" height="2.5"/>
<rect y="-393" width="210" height="2.5"/><rect y="-329" width="210" height="2.5"/><rect y="-265" width="210" height="2.5"/><rect y="-201" width="210" height="2.5"/><rect y="-137" width="210" height="2.5"/><rect y="-73" width="210" height="2.5"/>
<rect y="-400" width="18" height="400" fill="url(#stirrups)"/><rect x="96" y="-400" width="18" height="400" fill="url(#stirrups)"/><rect x="192" y="-400" width="18" height="400" fill="url(#stirrups)"/>
</g>
<g transform="matrix(-0.866 -0.5 0.866 -0.5 540 450)"><rect width="280" height="210" fill="url(#mesh)" opacity="0.6"/></g>
<rect x="542" y="300" width="3" height="50"/><rect x="551" y="300" width="3" height="50"/>
<rect x="466" y="256" width="3" height="50"/><rect x="475" y="256" width="3" height="50"/>
<rect x="390" y="212" width="3" height="50"/><rect x="399" y="212" width="3" height="50"/>
<rect x="625" y="252" width="3" height="50"/><rect x="634" y="252" width="3" height="50"/>
<rect x="549" y="208" width="3" height="50"/><rect x="558" y="208" width="3" height="50"/>
<rect x="473" y="164" width="3" height="50"/><rect x="482" y="164" width="3" height="50"/>
</g>
<!-- /layer -->
<!-- layer:frame -->
<g transform="translate(512 512) scale(1.18) translate(-510 -507)" mask="url(#mask-frame)">
<g transform="matrix(-0.866 -0.5 0 1 540 850)">
<rect y="-400" width="280" height="400" fill="#093A33"/>
<g fill="#C9C3B7">
<rect y="-400" width="18" height="400"/><rect x="87" y="-400" width="18" height="400"/><rect x="175" y="-400" width="18" height="400"/><rect x="262" y="-400" width="18" height="400"/>
<rect y="-400" width="280" height="10"/><rect y="-336" width="280" height="10"/><rect y="-272" width="280" height="10"/><rect y="-208" width="280" height="10"/><rect y="-144" width="280" height="10"/><rect y="-80" width="280" height="10"/><rect y="-10" width="280" height="10"/>
</g>
</g>
<g transform="matrix(0.866 -0.5 0 1 540 850)">
<rect y="-400" width="210" height="400" fill="#093A33"/>
<g fill="#C9C3B7">
<rect y="-400" width="18" height="400"/><rect x="96" y="-400" width="18" height="400"/><rect x="192" y="-400" width="18" height="400"/>
<rect y="-400" width="210" height="10"/><rect y="-336" width="210" height="10"/><rect y="-272" width="210" height="10"/><rect y="-208" width="210" height="10"/><rect y="-144" width="210" height="10"/><rect y="-80" width="210" height="10"/><rect y="-10" width="210" height="10"/>
</g>
</g>
<g transform="matrix(-0.866 -0.5 0.866 -0.5 540 450)"><rect width="280" height="210" fill="#E0DBD1"/></g>
<g transform="matrix(-0.866 -0.5 0 1 574.64 430)"><rect x="150" y="-40" width="80" height="40" fill="#C9C3B7"/></g>
<g transform="matrix(0.866 -0.5 0 1 410.1 375)"><rect x="40" y="-40" width="100" height="40" fill="#C9C3B7"/></g>
<g transform="matrix(-0.866 -0.5 0.866 -0.5 540 410)"><rect x="150" y="40" width="80" height="100" fill="#E0DBD1"/></g>
</g>
<!-- /layer -->
<!-- layer:facade -->
<g transform="translate(512 512) scale(1.18) translate(-510 -507)" mask="url(#mask-facade)">
<g transform="matrix(-0.866 -0.5 0 1 540 850)">
<rect y="-400" width="280" height="400" fill="#FFFFFF"/>
<rect x="14" y="-72" width="252" height="60" fill="#0E574D"/>
<g fill="#FFFFFF"><rect x="56" y="-72" width="4" height="60"/><rect x="98" y="-72" width="4" height="60"/><rect x="140" y="-72" width="4" height="60"/><rect x="182" y="-72" width="4" height="60"/><rect x="224" y="-72" width="4" height="60"/></g>
<rect x="96" y="-84" width="88" height="8" fill="#C9C3B7"/>
<rect x="20" y="-400" width="240" height="320" fill="url(#windows-left)"/>
<rect y="-400" width="280" height="8" fill="#D5E5E1"/>
</g>
<g transform="matrix(0.866 -0.5 0 1 540 850)">
<rect y="-400" width="210" height="400" fill="#D5E5E1"/>
<rect x="14" y="-72" width="182" height="60" fill="#0E574D"/>
<g fill="#D5E5E1"><rect x="60" y="-72" width="4" height="60"/><rect x="106" y="-72" width="4" height="60"/><rect x="152" y="-72" width="4" height="60"/></g>
<rect x="18" y="-400" width="184" height="320" fill="url(#windows-right)"/>
<rect y="-400" width="210" height="8" fill="#FFFFFF"/>
</g>
<g transform="matrix(-0.866 -0.5 0.866 -0.5 540 450)"><rect width="280" height="210" fill="#EEF3F2"/></g>
<g transform="matrix(-0.866 -0.5 0 1 574.64 430)"><rect x="150" y="-40" width="80" height="40" fill="#FFFFFF"/></g>
<g transform="matrix(0.866 -0.5 0 1 410.1 375)"><rect x="40" y="-40" width="100" height="40" fill="#D5E5E1"/></g>
<g transform="matrix(-0.866 -0.5 0.866 -0.5 540 410)"><rect x="150" y="40" width="80" height="100" fill="#EEF3F2"/></g>
</g>
