# cargo-deny configuration (SEC-05). Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# The allow list is a policy for future dependencies, not an inventory of current ones. This file
# also serves fuzz/, so an exception for a fuzz-only crate never matches in the main workspace.
unused-allowed-license = "allow"
unused-license-exception = "allow"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

# libfuzzer-sys bundles LLVM's libFuzzer under NCSA, a permissive licence. It only builds the fuzz
# targets in fuzz/, never a shipped binary.
[[licenses.exceptions]]
crate = "libfuzzer-sys"
allow = ["NCSA"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
