# Bun configuration for the UI (AGENTS.md §4).

[install]
# Always save exact versions, never ^ or ~ ranges.
exact = true
# Supply-chain delay: refuse package versions published less than 14 days ago.
minimumReleaseAge = 1209600
# Security exceptions (AGENTS.md §4), one per package, each with its advisory and the date it
# reaches the 14-day age and can be removed:
# - undici 8.12.2 (jsdom's, tests only) fixes GHSA-xjj6-f33q-929c, GHSA-4qv8-2p9j-2685 and
#   GHSA-f72v-6w45-q472; 14 days old on 2026-10-29.
minimumReleaseAgeExcludes = ["undici"]
# Bun never runs dependency lifecycle scripts unless the package is listed in
# package.json "trustedDependencies". Justify every entry in the commit message.
