# Fuzz targets for the parsers and the geometry kernel (ENG-02), run with cargo-fuzz on the nightly
# in rust-toolchain.toml.
# A workspace of its own: libFuzzer needs nightly sanitizers, and the main workspace stays stable.
# How to run: docs/dev/quality.md.

[package]
name = "bimcraft-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
core-model = { path = "../crates/core-model" }
express = { path = "../crates/express" }
geom = { path = "../crates/geom" }
interop-ifc = { path = "../crates/interop-ifc" }
libfuzzer-sys = "=0.4.13"
persist = { path = "../crates/persist" }
schema = { path = "../crates/schema" }
schema-gen = { path = "../crates/schema-gen" }

# A native test tool, not a core crate: libFuzzer's harness writes crash files, which the ARCH-02
# lints of clippy.toml would flag inside `fuzz_target!`.
[lints.clippy]
disallowed_methods = "allow"
disallowed_types = "allow"

[[bin]]
name = "express_schema"
path = "fuzz_targets/express_schema.rs"
test = false
doc = false
bench = false

[[bin]]
name = "location"
path = "fuzz_targets/location.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_quantity"
path = "fuzz_targets/parse_quantity.rs"
test = false
doc = false
bench = false

[[bin]]
name = "project_values"
path = "fuzz_targets/project_values.rs"
test = false
doc = false
bench = false

[[bin]]
name = "schema_definition"
path = "fuzz_targets/schema_definition.rs"
test = false
doc = false
bench = false

[[bin]]
name = "step_reader"
path = "fuzz_targets/step_reader.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
