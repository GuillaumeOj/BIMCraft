# Virtual workspace. Every directory in crates/ is a member.
# Rules: AGENTS.md §4 (exact versions) and §7 (lints).

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"

# Every dependency is declared here once: external crates with an exact version ("=x.y.z"),
# workspace crates by path.
# Member crates use `name = { workspace = true }`.
[workspace.dependencies]
criterion = { version = "=0.8.2", default-features = false }
express = { path = "crates/express" }
# Without the default features, which fetch remote and file `$ref`s over HTTP and TLS.
jsonschema = { version = "=0.58.3", default-features = false }
libm = "=0.2.16"
num-rational = { version = "=0.4.2", default-features = false, features = [
  "num-bigint-std",
] }
platform = { path = "crates/platform" }
proptest = "=1.11.0"
rayon = "=1.12.0"
robust = "=1.2.0"
# Without the default `cache` feature, which only adds a statement cache and its dependencies.
rusqlite = { version = "=0.40.2", default-features = false, features = [
  "bundled",
  "ffi-sqlite-wasm-rs",
] }
schema = { path = "crates/schema" }
rust-names = { path = "crates/rust-names" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
toml = "=1.1.6"

# Member crates opt in with `[lints] workspace = true`.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "deny"

# The exact BigRational reference in geom's property tests is slow unoptimised; optimising only
# these two dev-dependencies cuts the test time without touching how geom itself is built.
[profile.dev.package.num-bigint]
opt-level = 3

[profile.dev.package.num-rational]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
