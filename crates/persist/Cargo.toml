[package]
name = "persist"
version = "0.0.0"
description = "Project files as SQLite databases: versions, the model's objects and transactions."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
core-model = { workspace = true }
platform = { workspace = true }
rusqlite = { workspace = true }
schema = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
platform = { workspace = true, features = ["testing"] }
proptest = { workspace = true }
# The crash-safety tests watch every write through SQLite's hooks; `hooks` adds no dependency.
rusqlite = { workspace = true, features = ["hooks"] }

[lints]
workspace = true
