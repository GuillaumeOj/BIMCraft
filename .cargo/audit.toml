# cargo-audit configuration (SEC-05). scripts/check-all.sh runs every audit from the repository
# root, so this file serves fuzz/ too and a personal ~/.cargo/audit.toml never applies.
# Keep `ignore` in sync with `[advisories] ignore` in deny.toml, with the reason for each entry.

[advisories]
ignore = [
  # proc-macro-error, unmaintained, via Tauri 2's GTK 3 stack (Linux webview); compile time only.
  "RUSTSEC-2024-0370",
  # glib 0.18 VariantStrIter unsoundness, via the same GTK 3 stack; never called.
  "RUSTSEC-2024-0429",
]
