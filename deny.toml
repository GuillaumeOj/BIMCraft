# cargo-deny configuration (SEC-05). Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Keep in sync with .cargo/audit.toml. Each entry says why it cannot be fixed here.
# RUSTSEC-2024-0429 (glib, unsound) is ignored there only: cargo-deny does not report unsound
# advisories of dependencies, and an unused ignore here warns.
ignore = [
  # Through gtk 0.18 (gtk3-macros), the GTK 3 stack Tauri 2 uses for its Linux webview; no
  # Tauri 2 release moves off it. A compile-time macro helper only, unmaintained, no flaw known.
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via Tauri 2's GTK 3 stack (Linux), compile time only" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The allow list is a policy for future dependencies, not an inventory of current ones. This file
# also serves fuzz/, so an exception for a fuzz-only crate never matches in the main workspace.
unused-allowed-license = "allow"
unused-license-exception = "allow"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

# libfuzzer-sys bundles LLVM's libFuzzer under NCSA, a permissive licence. It only builds the fuzz
# targets in fuzz/, never a shipped binary.
[[licenses.exceptions]]
crate = "libfuzzer-sys"
allow = ["NCSA"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Tauri's dependency tree brings its own versions of common crates (thiserror 1, toml 0.8, syn 1…);
# they are not ours to unify. Duplicates outside these trees still warn.
skip-tree = [
  { crate = "tauri", reason = "the desktop window's own dependency tree" },
  { crate = "tauri-build", reason = "the desktop window's build-time dependency tree" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
