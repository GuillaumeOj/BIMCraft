# Fuzzing exploration (ENG-02): nightly on main, on pull requests that touch the kernel or the
# targets, and on demand. Not a required check: why, and what to do with a crash, in
# docs/dev/quality.md#fuzzing.
name: Fuzz exploration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ["crates/geom/**", "fuzz/**"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      runs:
        description: Inputs per target (empty for the defaults of scripts/check-all.sh)
        type: number
        required: false

permissions:
  contents: read

concurrency:
  group: fuzz-explore-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  explore:
    name: Fuzzing (exploration)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          directory: fuzz
          # The targets the Fuzzing job of ci.yml builds: start from its cache.
          shared-key: fuzz
      - name: Install cargo-fuzz
        working-directory: fuzz
        run: cargo install --locked "cargo-fuzz@$CARGO_FUZZ_VERSION"
      - run: scripts/check-all.sh fuzz-explore
        env:
          FUZZ_RUNS: ${{ inputs.runs }}
          # A new seed each run, so nights on an unchanged main explore new inputs.
          FUZZ_SEED: ${{ github.run_number }}
      # Also when the run hits its time limit, so crashes found before it are kept.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() || cancelled()
        with:
          name: fuzz-explore-crashes
          path: fuzz/artifacts
          if-no-files-found: ignore
