# Versions are pinned exactly (AGENTS.md §4); Dependabot proposes the bumps.
# A 14-day cooldown matches the minimum release age rule.
# cargo and bun only accept `auto` or `lockfile-only`. With exact pins, `auto`
# rewrites the requirement itself, since a new version never matches the pin.
# For bun this holds only for applications: keep `ui/package.json` private, or
# Dependabot treats it as a library and widens pins into ranges.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    versioning-strategy: auto
    groups:
      rust-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    versioning-strategy: auto
    groups:
      fuzz-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: bun
    directory: /ui
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    versioning-strategy: auto
    groups:
      ui-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
