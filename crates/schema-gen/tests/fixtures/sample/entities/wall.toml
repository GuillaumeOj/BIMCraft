format = 1

[entity]
name = "Wall"
kind = "element"
doc = "A vertical element that bounds or subdivides spaces."
property_sets = ["Pset_WallCommon"]

[type]
doc = "A named wall build-up shared by many walls."

[ifc]
entity = "IfcWall"
predefined_type = "STANDARD"

[[attribute]]
name = "thickness"
value = "quantity:length"
on = "type"
required = true
doc = "Total thickness of the build-up."

[[attribute]]
name = "layer_names"
value = "list:text"
on = "type"
doc = "Layer names from the exterior face to the interior face."

[[attribute]]
name = "height"
value = "quantity:length"
on = "type_overridable"
default = 2.5

[[attribute]]
name = "base_offset"
value = "quantity:length"
default = 0.0
doc = "Height of the bottom face above the storey."

[[attribute]]
name = "mark"
value = "text"
doc = "Short label shown on drawings."

[[representation]]
lod = 100
context = "footprint"
generator = "wall::footprint"
depends_on = ["thickness"]

[[representation]]
lod = 300
context = "body"
generator = "wall::body"
depends_on = ["thickness", "height", "base_offset"]
